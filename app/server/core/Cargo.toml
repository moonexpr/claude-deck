[package]
name = "server-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "server_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1"
chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
eventsource-stream = "0.2"
futures = "0.3"
hex = "0.4.3"
libc = "0.2"
portable-pty = "0.8"
regex = "1.11.1"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-tungstenite = "0.29.0"
tower-http = { version = "0.6.10", features = ["cors", "fs", "trace"] }
zip = "2.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures-util = "0.3"
bytes = "1"
wiremock = "0.6"
