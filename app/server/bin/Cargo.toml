[package]
name = "server-bin"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server-bin"
path = "src/main.rs"

[dependencies]
server-core = { path = "../core" }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
anyhow = "1.0.102"
dotenvy = "0.15.7"
dirs = "6.0.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
