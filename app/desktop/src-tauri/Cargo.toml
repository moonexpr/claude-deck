[package]
name = "claude-deck-desktop"
version = "0.1.0"
edition = "2024"
description = "Claude Deck — Tauri 2 desktop wrapper"
build = "build.rs"

# This crate is intentionally NOT a member of app/server/Cargo.toml.
# It has its own Cargo.lock so the desktop build is fully self-contained.

[lib]
name = "claude_deck_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "claude-deck-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
server-core = { path = "../../server/core" }
axum = { version = "0.8", features = [] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
axum = { version = "0.8", features = [] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
